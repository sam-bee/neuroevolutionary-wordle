<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GA Telemetry</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/chart.umd.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <main>
        <header id="top">
          <h1>GA Telemetry</h1>
          <div class="controls">
            <select id="run-select" aria-label="Telemetry run"></select>
            <button id="refresh-button" type="button">Refresh</button>
          </div>
        </header>
        <section id="status" class="status">Loading telemetry runs...</section>
        <details id="fitness-scores" class="metric-section" open>
          <summary>
            <span>Fitness Scores</span>
          </summary>
          <details id="fitness-over-time" class="metric-subsection" open>
            <summary>
              <span>Fitness Scores Over Time</span>
            </summary>
            <div id="series-controls" class="series-controls" aria-label="Fitness series controls"></div>
            <div class="chart-shell">
              <canvas id="fitness-chart"></canvas>
            </div>
          </details>
          <details id="fitness-stddev" class="metric-subsection" open>
            <summary>
              <span>Fitness Standard Deviation Over Time</span>
            </summary>
            <div class="chart-shell chart-shell-small">
              <canvas id="stddev-chart"></canvas>
            </div>
          </details>
          <details id="distinct-fitness-values" class="metric-subsection" open>
            <summary>
              <span>Distinct Fitness Values Over Time</span>
            </summary>
            <div class="chart-shell chart-shell-small">
              <canvas id="distinct-values-chart"></canvas>
            </div>
          </details>
        </details>
        <details id="population" class="metric-section" open>
          <summary>
            <span>Population</span>
          </summary>
          <div class="chart-shell chart-shell-small">
            <canvas id="population-chart"></canvas>
          </div>
        </details>
        <details id="training-data" class="metric-section" open>
          <summary>
            <span>Training Data</span>
          </summary>
          <div class="chart-shell chart-shell-small">
            <canvas id="training-data-chart"></canvas>
          </div>
        </details>
        <details id="breeding" class="metric-section" open>
          <summary>
            <span>Breeding</span>
          </summary>
          <div class="chart-shell chart-shell-small">
            <canvas id="breeding-parent-usage-chart"></canvas>
          </div>
        </details>
      </main>
      <nav class="section-nav" aria-label="Telemetry sections">
        <a href="#top">Top</a>
        <a href="#fitness-scores">Fitness Scores</a>
        <a href="#fitness-over-time">Fitness Lines</a>
        <a href="#fitness-stddev">Fitness Stddev</a>
        <a href="#distinct-fitness-values">Distinct Values</a>
        <a href="#population">Population</a>
        <a href="#training-data">Training Data</a>
        <a href="#breeding">Breeding</a>
      </nav>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
