services:
  cuda-dev:
    image: neuroevolution-wordle:cuda13.1
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DOCKERCOMPOSE_UID: ${DOCKERCOMPOSE_UID}
        DOCKERCOMPOSE_GID: ${DOCKERCOMPOSE_GID}
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: false
    environment:
      DOCKERCOMPOSE_UID: ${DOCKERCOMPOSE_UID}
      DOCKERCOMPOSE_GID: ${DOCKERCOMPOSE_GID}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  telemetry-web:
    image: neuroevolution-wordle:telemetry-web
    build:
      context: .
      dockerfile: docker/telemetry-web.Dockerfile
      args:
        DOCKERCOMPOSE_UID: ${DOCKERCOMPOSE_UID}
        DOCKERCOMPOSE_GID: ${DOCKERCOMPOSE_GID}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ./telemetry/runs
        target: /telemetry/runs
        read_only: false
    environment:
      DOCKERCOMPOSE_UID: ${DOCKERCOMPOSE_UID}
      DOCKERCOMPOSE_GID: ${DOCKERCOMPOSE_GID}
      TELEMETRY_DIR: /telemetry/runs
      STATIC_DIR: /app/static
      LISTEN_ADDRESS: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8090:8080"
